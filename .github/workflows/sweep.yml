name: sweep

# End-to-end leaderboard refresh, run manually (Actions -> sweep -> Run workflow).
#
# ARCHIVED 2026-09-28: the nightly `schedule:` trigger was removed and the
# leaderboard is frozen at the 2026-07-02 sweep. To run this in a fork, set the
# secrets listed in docs/ARCHIVE.md (GROQ_API_KEY, DATABASE_URL,
# CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID; LANGFUSE_* optional), set the
# repository variable CLOUDFLARE_PAGES_PROJECT to your own Pages project, and
# dispatch it. To make it nightly again, add back:
#   schedule:
#     - cron: "17 4 * * *"
#
# Steps:
#   1. sweep EACH model over the golden set (sequential — parallel saturates the
#      shared Groq free-tier limit; --no-store so a degraded run never touches Neon)
#   2. quality-gated publish: a model whose sweep degraded (e.g. a free-tier daily
#      token-limit storm -> mostly status=error) is SKIPPED and keeps its prior
#      data, so a flaky run can't overwrite good numbers with a rate-limited dip;
#      healthy models are upserted into Neon and the static JSON snapshot is rebuilt
#   3. deploy the refreshed dashboard to Cloudflare Pages
#   4. commit the snapshot back so git matches the live site
#      (publish/export overwrite dashboard/public/data, i.e. the frozen snapshot)

on:
  workflow_dispatch:
    inputs:
      models:
        description: "comma-separated litellm model ids"
        default: "groq/openai/gpt-oss-120b,groq/openai/gpt-oss-20b,groq/qwen/qwen3.8-27b"
      seeds:
        description: "comma-separated seeds"
        default: "0,1,2"

permissions:
  contents: write

concurrency:
  group: sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv sync

      - name: Sweep each model -> runs-*.jsonl (sequential, --no-store)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_HOST: ${{ secrets.LANGFUSE_HOST }}
          MODELS: ${{ github.event.inputs.models || 'groq/openai/gpt-oss-120b,groq/openai/gpt-oss-20b,groq/qwen/qwen3.8-27b' }}
          SEEDS: ${{ github.event.inputs.seeds || '0,1,2' }}
        run: |
          IFS=',' read -ra MS <<< "$MODELS"
          i=0
          for m in "${MS[@]}"; do
            echo "::group::sweep $m"
            uv run python -m forgejudge.eval.sweep --model "$m" --seeds "$SEEDS" \
              --no-store --out "runs-$i.jsonl" \
              || echo "::warning::sweep for $m failed; it will be gated out at publish"
            echo "::endgroup::"
            i=$((i+1))
          done

      - name: Quality-gated publish -> Neon + dashboard JSON
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          uv run python -m forgejudge.eval.publish --runs 'runs-*.jsonl'

      - name: Deploy refreshed dashboard to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'forgejudge' }}
        run: |
          npx -y wrangler@4 pages deploy dashboard/public \
            --project-name "$PAGES_PROJECT" --branch main --commit-dirty=true \
            || { echo "::error title=Cloudflare Pages deploy failed::If the log above says 'Invalid access token [code: 9109]' or 'Authentication error [code: 10000]', the CLOUDFLARE_API_TOKEN repo secret is expired or revoked. Create a new Cloudflare API token with the 'Cloudflare Pages: Edit' permission and update the secret; the snapshot commit below only runs after a successful deploy."; exit 1; }

      - name: Commit refreshed snapshot back to the repo
        run: |
          if git diff --quiet -- dashboard/public/data; then
            echo "no leaderboard change to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dashboard/public/data
            git commit -m "chore(sweep): refresh leaderboard snapshot [skip ci]"
            git push
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()  # keep the raw runs for debugging even when a later step (e.g. deploy) fails
        with:
          name: sweep-runs
          path: runs-*.jsonl
          if-no-files-found: warn
