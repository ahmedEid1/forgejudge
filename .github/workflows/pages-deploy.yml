name: pages-deploy

# Deploy the static dashboard (dashboard/public) to Cloudflare Pages on demand.
#
# ARCHIVED 2026-09-28: this used to run on every push to main that touched
# dashboard/public/**. It is manual-only now (Actions -> pages-deploy -> Run
# workflow), so nothing deploys automatically. It needs the CLOUDFLARE_API_TOKEN
# (permission "Cloudflare Pages: Edit") and CLOUDFLARE_ACCOUNT_ID secrets; a fork
# also sets the repository variable CLOUDFLARE_PAGES_PROJECT to its own project.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: deploy dashboard → Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Deploy dashboard/public to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'forgejudge' }}
        run: |
          npx -y wrangler@4 pages deploy dashboard/public \
            --project-name "$PAGES_PROJECT" --branch main --commit-dirty=true
